summary: >-
  Against Gravity / Rec Room ran a real, first-party developer program — an Azure API Management
  developer portal at devportal.rec.net that issued subscription keys (Ocp-Apim-Subscription-Key
  header, or subscription-key query parameter) against the api.rec.net host, with a published
  third-party API access and usage policy in the company help center. The whole surface was
  decommissioned with the service. This artifact records the end-of-life, not an active lifecycle
  policy: there is no versioning policy, deprecation policy, SLA or status page left to harvest,
  because there is no longer a running API.

