name: Against Gravity
description: 'Against Gravity Corp was the Seattle software company founded in April 2016 by Nick Fajt,
  Cameron Brown, Dan Kroymann, Bilal Orhan, Josh Wehrly and John Bevis that built Rec Room, a cross-platform
  social gaming and user-generated-content world for PC, PlayStation, Xbox, Meta Quest, iOS and Android.
  The company later renamed itself Rec Room Inc. and is tracked in this network under the rec-room record.
  Rec Room announced on 2026-03-30 that it could not reach profitability, took its game servers offline on
  2026-06-01 and shut the rec.net community site down on 2026-06-09. It did run a real developer program:
  an Azure API Management developer portal at devportal.rec.net issuing subscription keys against
  api.rec.net. Both are gone — devportal.rec.net is a dangling CNAME to a deleted APIM instance and
  rec.net / api.rec.net answer TLS handshake_failure with no certificate. Only the legacy Squarespace
  marketing site at recroom.com is still served, so no live contract remains to harvest.'
